    const { useState, useEffect, createContext, useContext } = React;

    // --- CART & APP CONTEXT ---

      const [cartItems, setCartItems] = useState({
        'avocados': { id: 'avocados', name: 'Hass Avocados Imported', desc: 'Fresh & creamy • 300g', price: 179, originalPrice: 220, count: 1, img: 'https://lh3.googleusercontent.com/aida-public/AB6AXuBh-yQr41GrTdY5OewlKAZBXD2pWj-6STWJLzs3Tr6zdQ7sDUrWz4-IbfUeLdkCmqcgSI2l6XmPG633cvNrGhLR-8qcPKuRThB2aFwuDFTpxIgrUfHxENO2iZj6hyY8y1MLxmLvc4XQWPjAsDAejue4ryAl7p3-Dr7HI32aa2hzOaOSxjPhDcrNkw5OJXnYgxNUqRHwd09A4CGrcGI86GfxYcMXEL25OR40ueXLGdM' },
        'yogurt': { id: 'yogurt', name: 'Epigamia Greek Yogurt', desc: 'Alphonso Mango • 120g', price: 60, originalPrice: 70, count: 2, img: 'https://lh3.googleusercontent.com/aida-public/AB6AXuC5I7-G47I19-6JruN5hyfa7aibljB7OYoJW9qQYFcztX5SYOGJFHQvcpwyvmPfwS9M3S8m0_R6eTL7OPvaas-KlRwRlN0L_RO8kR6GNQf2pf4qPYYt8pZTM5TXfAzs6xO-gFzfgKoP_Sq_43DXldZEspPkMKmGSu2GiR99eGto03rTE62ZnBXAToY6ocj0ra_AHDyS8raWGAT3aBQTgXvv6JoC3pJCKBfWX2SwoeI' },
        'bread': { id: 'bread', name: 'Whole Wheat Brown Bread', desc: 'Zero Maida • 400g', price: 45, originalPrice: 50, count: 1, img: 'https://lh3.googleusercontent.com/aida-public/AB6AXuCAM_n7BqybdFXC94dZ3neL_SNpLx6hK6YGh1SD7C7aTVyAEsvNPkuslhgYzOXUtVpnHBSvH2H1xO2wLbU2-85WbtoZgtpb_5zRPnkX0_CsnK4dK576uNUu1Qua3ghHlpW44EVAIeJNOh0SKP6woj_MAfod86ho4NL7SwV-Fd_SyliOvgjTDf2toxF-M_d9FZ4VynxeVPxh2NBgvcBe_FwgOhn6P1jy8tainjgPK8c' },
        'butter': { id: 'butter', name: 'Amul Butter Pasteurized', desc: 'Salted • 100g', price: 40, originalPrice: 40, count: 1, img: 'https://lh3.googleusercontent.com/aida-public/AB6AXuDHwL4hYuyekfVbnKPzTtwOJbiqcuPiJMNt3HXNwVgGG7x-uXTkuYIYcR4UDnA8holpRmPYBXuUISlMUl8W1S8OqTwmMX4c256GAqIJTr-lFhugO3r-LRg52nV7oMJPW-0jDy-NLpikTBG7TiCN8kCeWR75e3LirABFZrl2M7QUJYo5riSQJ1FNhFZ-3rLoiO0HeYjjPmrc1k94JPjZCjtbaI20OHBdwgWfN5FGTXc' }
      });

      const [toastMsg, setToastMsg] = useState('');
      const [wallet] = useState(150);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(''), 2500);
      };

      const updateQty = (id, delta, itemDetails = null) => {
        setCartItems(prev => {
          const current = prev[id] || (itemDetails ? { ...itemDetails, count: 0 } : null);
          if (!current) return prev;
          const nextCount = (current.count || 0) + delta;
          if (nextCount <= 0) {
            const copy = { ...prev };
            delete copy[id];
            return copy;
          }
          return {
            ...prev,
            [id]: { ...current, count: nextCount }
          };
        });
      };

      const clearCart = () => setCartItems({});

      const totalItemsCount = Object.values(cartItems).reduce((acc, it) => acc + it.count, 0);
      const totalAmount = Object.values(cartItems).reduce((acc, it) => acc + (it.price * it.count), 0);

      return (
        <CartContext.Provider value={{ cartItems, updateQty, clearCart, totalItemsCount, totalAmount, toastMsg, showToast, wallet }}>
          {children}
        </CartContext.Provider>
      );
    }

    const useCart = () => useContext(CartContext);

    // --- REUSABLE COMPONENTS ---

          <button
            onClick={() => navigate('/')}
            className={`flex flex-col items-center justify-center px-2 py-1.5 transition-all duration-200 ${
              activeTab === 'home'
                ? 'bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-3 py-1.5 font-bold shadow-xs'
                : 'text-on-surface-variant hover:text-primary'
            }`}
          >
            <span className="material-symbols-outlined" data-weight={activeTab === 'home' ? 'fill' : 'normal'}>home</span>
            <span className="text-label-sm font-label-sm">Home</span>
          </button>

          <button
            onClick={() => navigate('/snacks')}
            className={`flex flex-col items-center justify-center px-2 py-1.5 transition-all duration-200 ${
              activeTab === 'categories'
                ? 'bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-3 py-1.5 font-bold shadow-xs'
                : 'text-on-surface-variant hover:text-primary'

          <button

              activeTab === 'search'
                ? 'bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-3 py-1.5 font-bold shadow-xs'
                : 'text-on-surface-variant hover:text-primary'
            }`}
          >
            <span className="material-symbols-outlined" data-weight={activeTab === 'search' ? 'fill' : 'normal'}>search</span>
            <span className="text-label-sm font-label-sm">Search</span>
          </button>

          <button
            onClick={() => navigate('/tracking')}
            className={`relative flex flex-col items-center justify-center px-2 py-1.5 transition-all duration-200 ${
              activeTab === 'orders'
                ? 'bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-3 py-1.5 font-bold shadow-xs'
                : 'text-on-surface-variant hover:text-primary'
            }`}
          >
            <span className="material-symbols-outlined" data-weight={activeTab === 'orders' ? 'fill' : 'normal'}>receipt_long</span>
            <span className="text-label-sm font-label-sm">Orders</span>
            <span className="absolute top-1 right-2 w-2 h-2 rounded-full bg-secondary"></span>
          </button>

          <button
            onClick={() => navigate('/account')}
            className={`flex flex-col items-center justify-center px-2 py-1.5 transition-all duration-200 ${
              activeTab === 'profile'
                ? 'bg-primary-container dark:bg-primary text-on-primary-container dark:text-on-primary rounded-full px-3 py-1.5 font-bold shadow-xs'
                : 'text-on-surface-variant hover:text-primary'
            }`}
          >
            <span className="material-symbols-outlined" data-weight={activeTab === 'profile' ? 'fill' : 'normal'}>person</span>
            <span className="text-label-sm font-label-sm">Profile</span>
          </button>
        </nav>
      );
    }

    // Micro Stepper Component
    function Stepper({ id, count, onAdd, onRemove }) {
      if (!count || count <= 0) {
        return (
          <button
            onClick={onAdd}
            className="bg-surface-container-lowest hover:bg-primary-container text-secondary border border-secondary font-label-md text-label-md px-3 py-1 rounded-full active:scale-95 transition-all flex items-center gap-1 shadow-xs"
          >
            <span className="material-symbols-outlined text-[14px]">add</span>
            ADD
          </button>
        );
      }
      return (
        <div className="flex items-center bg-primary text-on-primary rounded-full px-2 py-0.5 shadow-xs">
          <button
            onClick={onRemove}
            className="w-5 h-5 flex items-center justify-center text-on-primary hover:opacity-80 active:scale-90 transition-transform"
          >
            <span className="material-symbols-outlined text-[14px]">remove</span>
          </button>
          <span className="px-2 text-label-md font-label-md font-bold text-white">{count}</span>
          <button
            onClick={onAdd}
            className="w-5 h-5 flex items-center justify-center text-on-primary hover:opacity-80 active:scale-90 transition-transform"
          >
            <span className="material-symbols-outlined text-[14px]">add</span>
          </button>
        </div>
      );
    }

    // Floating Cart Bar (Bottom Sticky)
    function StickyCartPill() {
      const { totalItemsCount, totalAmount } = useCart();
      const navigate = useNavigate();

      if (totalItemsCount === 0) return null;

      return (
        <aside className="fixed bottom-16 md:bottom-6 left-1/2 -translate-x-1/2 z-40 w-[92%] max-w-xl">

              <div className="relative w-8 h-8 rounded-full bg-surface-container-highest flex items-center justify-center text-on-surface font-bold text-label-md">

                  </p>
                </div>

                {/* Rider Card */}
                <div className="bg-surface-container-low rounded p-3 flex items-center gap-3 border border-outline-variant/20 sm:min-w-[260px]">
                  <div className="relative">
                    <div className="w-12 h-12 rounded-full overflow-hidden bg-surface-container ring-2 ring-primary-container">
                      <img className="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDi2-Ix1Ndks5fmTidHyub632PZ6tlBOuIGVMZMtIrasyy9Nv_YmPgCecYXp47Ak60DmOhTWbpWJjUWCqdI40FIZPM6e_vLpNFv8P3BU3AI6hbJyxSXHAAhyN16GxEx0rVkWh3A7hCnxDpf3H60VpmYYq9LA8_dTpG01Zi0Ji23z5h9ujGbbLRwbf7do3JVp7Qa0wFIkJYvUMlyEwbQwGgwHXW-Bi1kROp332OKiGw" alt="Rider Ramesh" />
                    </div>
                    <div className="absolute -bottom-1 -right-1 bg-secondary text-on-secondary rounded-full p-0.5 flex items-center justify-center">
                      <span className="material-symbols-outlined text-[12px]" data-weight="fill">verified</span>
                    </div>
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center gap-1">
                      <h2 className="font-title-md text-title-md text-on-surface truncate">Ramesh K.</h2>
                      <span className="bg-surface-container-lowest text-on-surface text-[10px] font-bold px-1.5 py-0.2 rounded border border-outline-variant/40 flex items-center gap-0.5">
                        ★ 4.9
                      </span>
                    </div>
                    <p className="font-body-sm text-body-sm text-on-surface-variant truncate">Vaccinated & Eco-Certified</p>
                  </div>
                  <button
                    onClick={() => showToast('Calling Rider Ramesh...')}
                    className="w-10 h-10 rounded-full bg-primary-container text-on-surface hover:bg-secondary-container transition-colors flex items-center justify-center shrink-0 active:scale-95 shadow-sm"
                  >
                    <span className="material-symbols-outlined text-[20px]">call</span>
                  </button>
                </div>
              </div>
            </section>

            {/* Live GPS Telemetry Simulation */}
            <section className="bg-surface-container-lowest rounded-lg border border-outline-variant/30 overflow-hidden shadow-xs">
              <div className="p-space-sm sm:px-space-md border-b border-outline-variant/20 flex flex-wrap items-center justify-between gap-2 bg-surface-container-low/50">
                <div className="flex items-center gap-2">
                  <span className="material-symbols-outlined text-primary text-[20px]">navigation</span>
                  <span className="font-label-lg text-label-lg text-on-surface">Live GPS Route Telemetry</span>
                </div>
                <div className="flex items-center gap-3 text-on-surface-variant font-body-sm text-body-sm">
                  <span className="flex items-center gap-1">
                    <span className="w-2.5 h-2.5 rounded-full bg-primary"></span> Dark Store #04
                  </span>
                  <span className="material-symbols-outlined text-[14px]">arrow_forward</span>
                  <span className="flex items-center gap-1">
                    <span className="w-2.5 h-2.5 rounded-full bg-secondary-container"></span> 4th Cross Home
                  </span>
                </div>
              </div>

              <div className="relative w-full h-72 sm:h-84 bg-[#EBF2EB] overflow-hidden select-none">
                <svg className="absolute inset-0 w-full h-full" preserveAspectRatio="xMidYMid slice" viewBox="0 0 600 300">
                  <defs>
                    <linearGradient id="routeGradient" x1="0%" x2="100%" y1="100%" y2="0%">
                      <stop offset="0%" stopColor="#506625"></stop>
                      <stop offset="50%" stopColor="#16C784"></stop>
                      <stop offset="100%" stopColor="#103D2C"></stop>
                    </linearGradient>
                    <pattern height="40" id="urbanGrid" patternUnits="userSpaceOnUse" width="40">
                      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#DCE8DC" strokeWidth="1.5"></path>
                    </pattern>
                  </defs>
                  <rect fill="#EBF3EB" height="100%" width="100%"></rect>
                  <rect fill="url(#urbanGrid)" height="100%" opacity="0.75" width="100%"></rect>
                  <path d="M 0 120 L 600 100" stroke="#FFFFFF" strokeLinecap="round" strokeWidth="8"></path>
                  <path d="M 120 0 L 160 300" stroke="#FFFFFF" strokeLinecap="round" strokeWidth="6"></path>
                  <path d="M 340 0 L 300 300" stroke="#FFFFFF" strokeLinecap="round" strokeWidth="7"></path>
                  <path d="M 46 220 C 110 200, 150 160, 210 130 C 270 100, 310 120, 360 70 C 400 30, 480 60, 520 40" fill="none" stroke="url(#routeGradient)" strokeDasharray="8 6" strokeLinecap="round" strokeWidth="6"></path>
                </svg>

                {/* Origin Store Pin */}
                <div className="absolute left-8 bottom-12 -translate-x-1/2 flex flex-col items-center">
                  <div className="bg-inverse-surface text-inverse-on-surface px-2.5 py-1 rounded-full text-[11px] font-bold shadow-md whitespace-nowrap mb-1.5 flex items-center gap-1 border border-primary-container/40">
                    <span className="w-1.5 h-1.5 rounded-full bg-primary-container"></span>
                    Store #04
                  </div>
                  <div className="w-7 h-7 rounded-full bg-primary text-on-primary flex items-center justify-center shadow-lg border-2 border-surface">
                    <span className="material-symbols-outlined text-[16px]">storefront</span>
                  </div>
                </div>

                {/* Animated Rider Pin */}
                <div className="rider-track absolute left-0 top-0 -translate-x-1/2 -translate-y-1/2 pointer-events-none">
                  <div className="relative flex items-center justify-center">
                    <span className="absolute w-12 h-12 rounded-full bg-secondary/25 animate-ping"></span>
                    <div className="w-10 h-10 rounded-full bg-primary-container border-2 border-on-surface shadow-xl flex items-center justify-center text-on-surface">
                      <span className="material-symbols-outlined text-[22px]">electric_moped</span>
                    </div>
                  </div>
                </div>

                {/* Destination Home Pin */}
                <div className="absolute right-12 top-6 translate-x-1/2 flex flex-col items-center">
                  <div className="bg-surface-container-lowest text-on-surface px-2.5 py-1 rounded-full text-[11px] font-bold shadow-md whitespace-nowrap mb-1.5 flex items-center gap-1 border border-outline-variant/40">
                    <span className="material-symbols-outlined text-[12px] text-error fill">home</span>
                    Your Home
                  </div>
                  <div className="w-7 h-7 rounded-full bg-error text-on-error flex items-center justify-center shadow-lg border-2 border-surface">
                    <span className="material-symbols-outlined text-[16px] fill">location_on</span>
                  </div>
                </div>
              </div>
            </section>

            {/* Delivery Milestones Stepper */}
            <div className="grid grid-cols-1 md:grid-cols-12 gap-space-md">
              <section className="md:col-span-7 bg-surface-container-lowest rounded-lg p-space-md md:p-space-lg border border-outline-variant/30 shadow-xs">
                <div className="flex items-center justify-between pb-space-sm border-b border-outline-variant/20 mb-space-md">
                  <h2 className="font-headline-sm text-headline-sm text-on-surface tracking-tight">Delivery Milestones</h2>
                  <span className="font-label-sm text-label-sm px-2.5 py-1 rounded-full bg-tertiary-container text-on-tertiary-container">
                    Cold-Chain Verified
                  </span>
                </div>

                <div className="relative pl-6 space-y-6 before:absolute before:left-[11px] before:top-2 before:bottom-3 before:w-0.5 before:bg-outline-variant/40">
                  <div className="relative flex items-start gap-3">
                    <div className="absolute -left-[30px] top-0.5 w-6 h-6 rounded-full bg-secondary text-on-secondary flex items-center justify-center ring-4 ring-surface-container-lowest">
                      <span className="material-symbols-outlined text-[14px]">check</span>
                    </div>
                    <div>
                      <p className="font-title-md text-title-md text-on-surface">Order Placed (10:42 AM)</p>
                      <p className="font-body-sm text-body-sm text-on-surface-variant">Payment confirmed via UPI Instant</p>
                    </div>
                  </div>

                  <div className="relative flex items-start gap-3">
                    <div className="absolute -left-[30px] top-0.5 w-6 h-6 rounded-full bg-secondary text-on-secondary flex items-center justify-center ring-4 ring-surface-container-lowest">
                      <span className="material-symbols-outlined text-[14px]">check</span>
                    </div>
                    <div>
                      <p className="font-title-md text-title-md text-on-surface">Packed with Care (10:45 AM)</p>
                      <p className="font-body-sm text-body-sm text-on-surface-variant">Inspected & bagged in insulated pouch (4°C)</p>
                    </div>
                  </div>

                  <div className="relative flex items-start gap-3">
                    <div className="absolute -left-[30px] top-0.5 w-6 h-6 rounded-full bg-primary-container border-2 border-primary text-on-surface flex items-center justify-center ring-4 ring-surface-container-lowest animate-pulse">
                      <span className="w-2.5 h-2.5 rounded-full bg-primary"></span>
                    </div>
                    <div className="bg-primary-container/30 -m-1 p-2.5 rounded border border-primary-container">
                      <p className="font-title-md text-title-md text-on-surface font-bold">Out for Delivery (10:48 AM)</p>
                      <p className="font-body-sm text-body-sm text-on-surface mt-0.5">Ramesh K. has picked up items from Indiranagar Hub</p>
                    </div>
                  </div>
                </div>
              </section>

              {/* Basket Summary */}
              <section className="md:col-span-5 bg-surface-container-lowest rounded-lg p-space-md border border-outline-variant/30 shadow-xs flex flex-col justify-between">
                <div>
                  <div className="flex items-center justify-between pb-space-sm border-b border-outline-variant/20 mb-space-md">
                    <h2 className="font-headline-sm text-headline-sm text-on-surface">Basket Summary</h2>
                    <span className="px-2.5 py-1 rounded-full bg-surface-container text-on-surface font-label-sm text-label-sm">
                      Paid • ₹328
                    </span>
                  </div>
                  <ul className="space-y-3 divide-y divide-outline-variant/15">
                    <li className="pt-2 first:pt-0 flex items-center justify-between">
                      <span className="text-on-surface font-label-md">Hass Avocados (2 pcs)</span>
                      <span className="font-price-catalog text-primary font-bold">₹149</span>
                    </li>
                    <li className="pt-2 flex items-center justify-between">
                      <span className="text-on-surface font-label-md">Epigamia Greek Yogurt</span>
                      <span className="font-price-catalog text-primary font-bold">₹60</span>
                    </li>
                    <li className="pt-2 flex items-center justify-between">
                      <span className="text-on-surface font-label-md">Artisan Brown Bread</span>
                      <span className="font-price-catalog text-primary font-bold">₹55</span>
                    </li>
                    <li className="pt-2 flex items-center justify-between">
                      <span className="text-on-surface font-label-md">Amul Pasteurized Butter</span>
                      <span className="font-price-catalog text-primary font-bold">₹64</span>
                    </li>
                  </ul>
                </div>
                <div className="mt-4 pt-2 border-t border-outline-variant/20 flex justify-between items-center text-body-sm text-outline">
                  <span>Delivered to: 4th Cross Home</span>
                  <button onClick={() => navigate('/account')} className="text-secondary font-bold hover:underline">Details</button>
                </div>
              </section>
            </div>

            <div className="text-center py-2">
              <span className="inline-flex items-center gap-1.5 font-body-sm text-body-sm text-tertiary bg-tertiary-container/40 px-3 py-1 rounded-full">
                <span className="material-symbols-outlined text-[14px]">energy_savings_leaf</span>
                This trip saved 140g CO2 using a zero-emission electric battery vehicle
              </span>
            </div>
          </main>
        </div>
      );
    }

    // --- MAIN APP CONTROLLER WITH ROUTER ---
    function App() {
      const { toastMsg } = useCart();

      return (
        <div className="relative min-h-screen">
          {/* Toast Notification Container */}
          {toastMsg && (
            <div className="fixed top-20 left-1/2 -translate-x-1/2 z-50 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full text-label-md font-medium shadow-lg transition-all animate-bounce">
              {toastMsg}
            </div>
          )}

          <Routes>
            <Route path="/" element={<HomeScreen />} />
            <Route path="/cart" element={<CartScreen />} />
            <Route path="/search" element={<SearchScreen />} />
            <Route path="/product/avocados" element={<ProductDetailsScreen />} />
            <Route path="/account" element={<AccountScreen />} />
            <Route path="/snacks" element={<CategoryScreen />} />
            <Route path="/tracking" element={<TrackingScreen />} />
          </Routes>
        </div>
      );
    }

    const container = document.getElementById('root');
    const root = createRoot(container);
    root.render(
      <MemoryRouter>
        <CartProvider>
          <App />
        </CartProvider>
      </MemoryRouter>
    );
  </script>
</body>
</html>
